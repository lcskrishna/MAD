# Model catalog for sglang_disagg_mori_ep.sh
# -----------------------------------------------------------------------------
# Each model contains:
# - base_flags: always applied (both TP/DP mode, prefill/decode)
# - tp_flags: mode-level flags when PARALLEL_MODE=tp
# - dp_flags: mode-level flags when PARALLEL_MODE=dp
# - prefill/decode.<tp|dp>: role + mode specific flags
#
# Add new models by copying one block and changing values.

DeepSeek-R1:
  base_flags: "--moe-a2a-backend mori --attention-backend aiter --watchdog-timeout 1000000 --mem-fraction-static 0.8 --disable-radix-cache"
  tp_flags: ""
  dp_flags: "--enable-dp-attention --enable-dp-lm-head --moe-dense-tp-size 1 "
  prefill:
    tp: "--max-running-requests 8 --cuda-graph-bs $(seq 1 3)"
    dp: "--max-running-requests 8 --cuda-graph-bs $(seq 1 3)"
  decode:
    tp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 64)"
    dp: "--max-running-requests 8192 --cuda-graph-bs $(seq 1 8)"